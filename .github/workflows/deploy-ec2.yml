name: Deploy First backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            APP_DIR="/opt/apps/First"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing git repo at $APP_DIR. Clone this repo on the server first."
              exit 1
            fi

            cd "$APP_DIR"
            git pull --ff-only

            if docker info >/dev/null 2>&1; then
              DOCKER="docker"
            elif sudo -n docker info >/dev/null 2>&1; then
              DOCKER="sudo docker"
            else
              echo "Docker daemon is not accessible for this user"
              id
              groups
              exit 1
            fi

            if $DOCKER compose version >/dev/null 2>&1; then
              COMPOSE="$DOCKER compose"
            elif command -v docker-compose >/dev/null 2>&1 && docker-compose version >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            elif command -v docker-compose >/dev/null 2>&1 && sudo -n docker-compose version >/dev/null 2>&1; then
              COMPOSE="sudo docker-compose"
            else
              echo "Docker Compose is not installed on the server"
              exit 1
            fi

            echo "Using compose command: $COMPOSE"
            $COMPOSE up --build -d --remove-orphans
            $COMPOSE exec -T api alembic upgrade head
            $DOCKER image prune -f
